  <body
    class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary px-3"
  >
    <main class="form-signin w-100 m-auto px-3">
      <form class="form-signin" action="/dashboard" method="post">
        <img
          class="mb-4"
          src="https://cdni.iconscout.com/illustration/premium/thumb/user-showing-login-page-in-website-or-application-illustration-download-svg-png-gif-file-formats--web-flat-modern-pack-seo-illustrations-1597938.png"
          alt=""
          width="72"
          height="57"
        />
        <h1 class="h3 mb-3 fw-normal">Please sign in</h1>
        <div class="form-floating">
          <input
            type="text"
            name="uname"
            class="form-control"
            id="uname"
            required
            placeholder="name@example.com"
          />
          <label for="uname">User Name</label>
        </div>
        <!-- <br> -->
        <div class="form-floating">
          <input
            type="password"
            class="form-control"
            id="pass"
            name="pass"
            placeholder="Password"
            required
          />
          <label for="pass">Password</label>
        </div>
        <div class="form-check text-start my-3">
          <input
            class="form-check-input"
            type="checkbox"
            value="remember-me"
            id="flexCheckDefault"
          />
          <label class="form-check-label" for="flexCheckDefault">
            Remember me
          </label>
        </div>
        <button class="btn btn-primary w-100 py-2" type="submit">
          Sign in
        </button>
        <p class="mt-5 mb-3 text-body-secondary">
          &copy; {{params ['blog_name'] }} 2017-2024
        </p>
      </form>
    </main>
